<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%" style="image-rendering: pixelated; shape-rendering: crispEdges;">
  <defs>
    <pattern id="pixelGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FAF6EE"/>
      <rect x="0" y="0" width="1" height="1" fill="#EFE8DA" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Wallpaper with pixel grid -->
  <rect width="240" height="140" fill="url(#pixelGrid)" />
  
  <!-- Subtle room baseboard / wall trim -->
  <rect x="0" y="0" width="240" height="8" fill="#EFE8DA" />
  <rect x="0" y="8" width="240" height="2" fill="#D5CBB9" />

  <!-- Wooden Workshop Table Top -->
  <rect x="0" y="104" width="240" height="36" fill="#D8CFBE" />
  <rect x="0" y="104" width="240" height="3" fill="#E9E2D5" />
  <rect x="0" y="107" width="240" height="2" fill="#BFAF9B" />
  <rect x="0" y="118" width="240" height="2" fill="#CBBFAA" opacity="0.6"/>
  <rect x="0" y="130" width="240" height="2" fill="#CBBFAA" opacity="0.6"/>

  <!-- Left: Pixel Botanical Eucalyptus & Lavender Sprig -->
  <!-- Stem -->
  <rect x="24" y="98" width="18" height="2" fill="#047857" transform="rotate(-25 24 98)" />
  <rect x="36" y="86" width="16" height="2" fill="#047857" transform="rotate(-40 36 86)" />
  <!-- Leaves -->
  <rect x="22" y="90" width="6" height="4" fill="#10B981" />
  <rect x="23" y="91" width="4" height="2" fill="#34D399" />
  <rect x="30" y="82" width="7" height="5" fill="#059669" />
  <rect x="31" y="83" width="5" height="3" fill="#34D399" />
  <rect x="38" y="74" width="6" height="4" fill="#10B981" />
  <rect x="42" y="68" width="5" height="4" fill="#047857" />
  <!-- Berry buds -->
  <rect x="20" y="86" width="3" height="3" fill="#E2E8F0" />
  <rect x="36" y="78" width="3" height="3" fill="#CBD5E1" />
  <rect x="46" y="66" width="3" height="3" fill="#E2E8F0" />
  <rect x="48" y="67" width="1" height="1" fill="#FFFFFF" />

  <!-- Left: Pixel Kraft Tag with string -->
  <rect x="42" y="108" width="22" height="14" fill="#F4EFE6" stroke="#D5CBB9" stroke-width="1"/>
  <rect x="44" y="112" width="8" height="2" fill="#92400E" />
  <rect x="44" y="116" width="14" height="2" fill="#B45309" opacity="0.7"/>
  <rect x="60" y="110" width="2" height="2" fill="#78350F" />
  <!-- Twine string -->
  <rect x="62" y="106" width="16" height="2" fill="#B45309" transform="rotate(15 62 106)" />

  <!-- Center: Large 16-bit Gift Box (Width 64, Height 52) -->
  <!-- Box Drop Shadow on Table -->
  <rect x="84" y="106" width="72" height="8" fill="#BFAF9B" opacity="0.6"/>
  <rect x="88" y="108" width="64" height="4" fill="#A89884" opacity="0.5"/>

  <!-- Gift Box Body (x: 88, y: 60, w: 64, h: 46) -->
  <!-- Dark border outline -->
  <rect x="88" y="60" width="64" height="46" fill="#1E293B" />
  <!-- Main ruby red fill -->
  <rect x="90" y="62" width="60" height="42" fill="#DC2626" />
  <!-- Shading & Highlights -->
  <rect x="90" y="62" width="60" height="4" fill="#EF4444" />
  <rect x="90" y="62" width="4" height="42" fill="#F87171" opacity="0.6"/>
  <rect x="146" y="62" width="4" height="42" fill="#991B1B" />
  <rect x="90" y="100" width="60" height="4" fill="#991B1B" />

  <!-- Vertical Golden Ribbon (Width 12, x: 114) -->
  <rect x="114" y="60" width="12" height="46" fill="#B45309" />
  <rect x="116" y="60" width="8" height="46" fill="#F59E0B" />
  <rect x="117" y="60" width="3" height="46" fill="#FDE68A" />

  <!-- Horizontal Golden Ribbon (Height 10, y: 78) -->
  <rect x="88" y="78" width="64" height="10" fill="#B45309" />
  <rect x="88" y="80" width="64" height="6" fill="#F59E0B" />
  <rect x="88" y="81" width="64" height="2" fill="#FDE68A" />

  <!-- Center Cross Knot Highlight -->
  <rect x="114" y="78" width="12" height="10" fill="#D97706" />
  <rect x="116" y="80" width="8" height="6" fill="#FCD34D" />

  <!-- Gift Box Lid Overhang -->
  <rect x="86" y="56" width="68" height="8" fill="#1E293B" />
  <rect x="88" y="58" width="64" height="4" fill="#EF4444" />
  <rect x="114" y="56" width="12" height="8" fill="#F59E0B" />
  <rect x="117" y="56" width="3" height="8" fill="#FEF08A" />

  <!-- Ribbon Big Pixel Bow on Top (y: 40 to 56) -->
  <!-- Left loop -->
  <rect x="100" y="44" width="16" height="14" fill="#1E293B" />
  <rect x="102" y="46" width="12" height="10" fill="#F59E0B" />
  <rect x="104" y="48" width="6" height="6" fill="#FEF08A" />
  <rect x="106" y="50" width="4" height="4" fill="#B45309" />
  <!-- Right loop -->
  <rect x="124" y="44" width="16" height="14" fill="#1E293B" />
  <rect x="126" y="46" width="12" height="10" fill="#F59E0B" />
  <rect x="130" y="48" width="6" height="6" fill="#FEF08A" />
  <rect x="130" y="50" width="4" height="4" fill="#B45309" />
  <!-- Center Knot -->
  <rect x="115" y="48" width="10" height="10" fill="#1E293B" />
  <rect x="117" y="50" width="6" height="6" fill="#FCD34D" />
  <rect x="119" y="52" width="2" height="2" fill="#FFFFFF" />

  <!-- Red Wax Seal with '礼' on the Box -->
  <rect x="130" y="70" width="16" height="16" fill="#7F1D1D" rx="2"/>
  <rect x="132" y="72" width="12" height="12" fill="#DC2626" />
  <rect x="134" y="74" width="8" height="8" fill="#B91C1C" />
  <!-- Pixel '礼' inside seal -->
  <rect x="136" y="75" width="4" height="1" fill="#FEF08A" />
  <rect x="137" y="76" width="2" height="4" fill="#FEF08A" />
  <rect x="135" y="78" width="6" height="1" fill="#FEF08A" />
  <rect x="136" y="80" width="1" height="2" fill="#FEF08A" />
  <rect x="139" y="80" width="2" height="2" fill="#FEF08A" />

  <!-- Right: Pixel Envelope with letter poking out -->
  <rect x="168" y="92" width="34" height="24" fill="#1E293B" />
  <rect x="170" y="94" width="30" height="20" fill="#FFFFFF" />
  <!-- Letter fold lines -->
  <polygon points="170,94 185,106 200,94" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Paper sticking out -->
  <rect x="174" y="82" width="22" height="14" fill="#FEF9C3" stroke="#D5CBB9" stroke-width="1"/>
  <rect x="178" y="86" width="14" height="2" fill="#D97706" />
  <rect x="178" y="90" width="10" height="2" fill="#D97706" opacity="0.6"/>
  <!-- Mini seal on envelope -->
  <rect x="183" y="103" width="5" height="5" fill="#DC2626" />

  <!-- Right: Brass Scissors on Table -->
  <rect x="206" y="112" width="24" height="12" fill="transparent"/>
  <!-- Blades -->
  <rect x="208" y="116" width="12" height="2" fill="#94A3B8" transform="rotate(-15 208 116)" />
  <rect x="208" y="118" width="12" height="2" fill="#64748B" transform="rotate(15 208 118)" />
  <!-- Gold Handles -->
  <rect x="220" y="110" width="8" height="6" fill="#F59E0B" rx="1"/>
  <rect x="222" y="112" width="4" height="2" fill="#D8CFBE" />
  <rect x="220" y="120" width="8" height="6" fill="#F59E0B" rx="1"/>
  <rect x="222" y="122" width="4" height="2" fill="#D8CFBE" />

  <!-- Floating Pixel Sparkles & Particle Stars -->
  <!-- Star 1 Top Left -->
  <g class="pixel-star-1">
    <rect x="72" y="32" width="3" height="9" fill="#F59E0B" />
    <rect x="69" y="35" width="9" height="3" fill="#F59E0B" />
    <rect x="72" y="35" width="3" height="3" fill="#FFFFFF" />
  </g>

  <!-- Star 2 Top Right -->
  <g class="pixel-star-2">
    <rect x="162" y="26" width="2" height="6" fill="#10B981" />
    <rect x="160" y="28" width="6" height="2" fill="#10B981" />
    <rect x="162" y="28" width="2" height="2" fill="#FFFFFF" />
  </g>

  <!-- Star 3 Above Box -->
  <g class="pixel-star-3">
    <rect x="120" y="18" width="3" height="7" fill="#FCD34D" />
    <rect x="118" y="20" width="7" height="3" fill="#FCD34D" />
    <rect x="120" y="20" width="3" height="3" fill="#FFFFFF" />
  </g>

  <!-- Small floating pixel dust squares -->
  <rect x="52" y="48" width="3" height="3" fill="#F59E0B" opacity="0.85"/>
  <rect x="64" y="68" width="2" height="2" fill="#DC2626" opacity="0.7"/>
  <rect x="80" y="20" width="3" height="3" fill="#10B981" opacity="0.8"/>
  <rect x="150" y="16" width="2" height="2" fill="#3B82F6" opacity="0.75"/>
  <rect x="176" y="44" width="3" height="3" fill="#F59E0B" opacity="0.85"/>
  <rect x="194" y="32" width="2" height="2" fill="#EC4899" opacity="0.7"/>
  <rect x="188" y="70" width="3" height="3" fill="#10B981" opacity="0.8"/>
</svg>