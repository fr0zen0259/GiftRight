<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="100%" height="100%" style="image-rendering: pixelated; shape-rendering: crispEdges;">
  <defs>
    <pattern id="heroGrid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#FAF7F0"/>
      <rect x="0" y="0" width="1" height="1" fill="#E8DFD0" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="220" height="120" fill="url(#heroGrid)" />
  
  <!-- Studio Wall Trim -->
  <rect x="0" y="0" width="220" height="6" fill="#EAE2D4" />
  <rect x="0" y="6" width="220" height="2" fill="#D5CBB9" />

  <!-- Wooden Workbench -->
  <rect x="0" y="84" width="220" height="36" fill="#D8CFBE" />
  <rect x="0" y="84" width="220" height="2" fill="#EFE8DD" />
  <rect x="0" y="86" width="220" height="2" fill="#BFB09D" />
  <rect x="0" y="98" width="220" height="2" fill="#CBBFAA" opacity="0.5"/>

  <!-- Left: Spool of Ribbon & Twine -->
  <rect x="16" y="76" width="14" height="18" fill="#1E293B" />
  <rect x="17" y="77" width="12" height="16" fill="#78350F" />
  <rect x="19" y="80" width="8" height="10" fill="#D97706" />
  <rect x="21" y="82" width="4" height="6" fill="#FEF08A" />
  <!-- Thread unspooling -->
  <path d="M 30 88 Q 42 94 54 86" stroke="#D97706" stroke-width="1.5" fill="none" />

  <!-- Botanical Sprig -->
  <rect x="44" y="62" width="6" height="4" fill="#059669" />
  <rect x="48" y="56" width="6" height="4" fill="#10B981" />
  <rect x="52" y="50" width="5" height="4" fill="#34D399" />
  <rect x="42" y="68" width="16" height="2" fill="#047857" transform="rotate(-30 42 68)" />

  <!-- Centerpiece: 16-Bit Handcrafted Gift Box -->
  <rect x="76" y="86" width="64" height="6" fill="#BFAF9B" opacity="0.6"/>
  <!-- Box -->
  <rect x="80" y="48" width="56" height="40" fill="#1E293B" />
  <rect x="82" y="50" width="52" height="36" fill="#DC2626" />
  <rect x="82" y="50" width="52" height="3" fill="#EF4444" />
  <rect x="82" y="50" width="3" height="36" fill="#F87171" opacity="0.6"/>
  <rect x="131" y="50" width="3" height="36" fill="#991B1B" />
  <rect x="82" y="83" width="52" height="3" fill="#991B1B" />

  <!-- Gold Ribbon -->
  <rect x="103" y="48" width="10" height="40" fill="#B45309" />
  <rect x="105" y="48" width="6" height="40" fill="#F59E0B" />
  <rect x="106" y="48" width="2" height="40" fill="#FEF08A" />

  <rect x="80" y="64" width="56" height="8" fill="#B45309" />
  <rect x="80" y="66" width="56" height="4" fill="#F59E0B" />
  <rect x="80" y="67" width="56" height="2" fill="#FEF08A" />

  <!-- Box Bow Top -->
  <rect x="94" y="34" width="12" height="12" fill="#1E293B" />
  <rect x="96" y="36" width="8" height="8" fill="#F59E0B" />
  <rect x="98" y="38" width="4" height="4" fill="#FEF08A" />
  <rect x="110" y="34" width="12" height="12" fill="#1E293B" />
  <rect x="112" y="36" width="8" height="8" fill="#F59E0B" />
  <rect x="114" y="38" width="4" height="4" fill="#FEF08A" />
  <!-- Knot -->
  <rect x="104" y="38" width="8" height="8" fill="#1E293B" />
  <rect x="106" y="40" width="4" height="4" fill="#FCD34D" />

  <!-- Wax Seal [礼] -->
  <rect x="118" y="56" width="14" height="14" fill="#7F1D1D" rx="2"/>
  <rect x="120" y="58" width="10" height="10" fill="#DC2626" />
  <rect x="122" y="60" width="6" height="6" fill="#B91C1C" />
  <!-- Pixel 礼 character -->
  <rect x="123" y="61" width="4" height="1" fill="#FEF08A" />
  <rect x="124" y="62" width="2" height="3" fill="#FEF08A" />
  <rect x="123" y="64" width="4" height="1" fill="#FEF08A" />

  <!-- Right: Ruled Letter Paper & Stamp -->
  <rect x="148" y="74" width="30" height="22" fill="#1E293B" />
  <rect x="150" y="76" width="26" height="18" fill="#FFFFFF" />
  <rect x="154" y="80" width="18" height="2" fill="#CBD5E1" />
  <rect x="154" y="84" width="14" height="2" fill="#CBD5E1" />
  <rect x="154" y="88" width="10" height="2" fill="#CBD5E1" />
  <!-- Red postage stamp on letter -->
  <rect x="168" y="78" width="6" height="6" fill="#DC2626" />
  <rect x="170" y="80" width="2" height="2" fill="#FEF08A" />

  <!-- Right: Brass Scissors -->
  <rect x="188" y="94" width="24" height="10" fill="transparent"/>
  <rect x="188" y="96" width="12" height="2" fill="#94A3B8" transform="rotate(-15 188 96)" />
  <rect x="188" y="98" width="12" height="2" fill="#64748B" transform="rotate(15 188 98)" />
  <rect x="198" y="92" width="6" height="5" fill="#F59E0B" rx="1"/>
  <rect x="198" y="100" width="6" height="5" fill="#F59E0B" rx="1"/>

  <!-- Pixel Floating Magic Sparkles -->
  <g>
    <rect x="66" y="24" width="2" height="6" fill="#F59E0B" />
    <rect x="64" y="26" width="6" height="2" fill="#F59E0B" />
    <rect x="66" y="26" width="2" height="2" fill="#FFFFFF" />
  </g>
  <g>
    <rect x="146" y="20" width="2" height="6" fill="#10B981" />
    <rect x="144" y="22" width="6" height="2" fill="#10B981" />
    <rect x="146" y="22" width="2" height="2" fill="#FFFFFF" />
  </g>
  <rect x="36" y="38" width="2" height="2" fill="#F59E0B" opacity="0.8"/>
  <rect x="160" y="36" width="3" height="3" fill="#F59E0B" opacity="0.85"/>
  <rect x="178" y="26" width="2" height="2" fill="#EC4899" opacity="0.8"/>
  <rect x="94" y="14" width="2" height="2" fill="#3B82F6" opacity="0.8"/>
</svg>